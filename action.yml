name: 'Merge transi-store translation branch'
description: 'Merge a translation branch for projects configured in transi-store.config.json'
author: 'transi-store'
branding:
  icon: 'git-merge'
  color: 'blue'

inputs:
  branch:
    description: 'Branch slug to merge'
    required: true
  api-key:
    description: 'transi-store API key'
    required: true
  config:
    description: 'Path to transi-store.config.json (relative to the workspace)'
    required: false
    default: 'transi-store.config.json'
  cli-version:
    description: 'Version of @transi-store/cli to install (npm dist-tag or semver)'
    required: false
    default: 'latest'
  node-version:
    description: 'Node.js version'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Merge translation branch
      shell: bash
      # Inputs are passed through env vars and never interpolated in `run:`:
      # a branch name such as `x$(id)` would otherwise be executed by bash.
      env:
        TRANSI_STORE_API_KEY: ${{ inputs.api-key }}
        BRANCH: ${{ inputs.branch }}
        CONFIG: ${{ inputs.config }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        npx --yes "@transi-store/cli@${CLI_VERSION}" merge \
          --config "$CONFIG" \
          --branch "$BRANCH"
